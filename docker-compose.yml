# Local full-stack (S05): Postgres + Redis + the four Pulse services, with health gates so dependents wait for
# healthy upstreams. Not run in CI (CI stays infra-less); this is the deploy shape and the lab environment.
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build: { context: ., dockerfile: apps/ingest/Dockerfile }
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
    ports: ["3002:3002"]
    depends_on:
      redis: { condition: service_healthy }

  consumer:
    build: { context: ., dockerfile: apps/consumer/Dockerfile }
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["4173:4173"]
    depends_on:
      api: { condition: service_started }
